<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frase del Día para Notion</title>
    
    <!-- Importamos fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Variables para el Tema Claro */
        :root {
            --bg-body: #ffffff; /* Fondo del iframe en modo claro */
            --bg-card: #fff7f2; /* Naranja muy sutil */
            --border-card: #f3decb; /* Borde sutil acorde al tono */
            --text-main: #37352f;
            --text-muted: #787774;
            --btn-border: #e6cbbe;
            --btn-hover-bg: #faebe0;
            --shadow: rgba(0, 0, 0, 0.04);
        }

        /* Variables para el Tema Oscuro */
        [data-theme="dark"] {
            --bg-body: #191919; /* Fondo oscuro exacto de Notion (elimina el recuadro blanco) */
            --bg-card: #26201d; /* Naranja muy sutil adaptado al modo oscuro */
            --border-card: #3a2e26; /* Borde oscuro y cálido acorde */
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: #9b9b9b;
            --btn-border: #4a3a30;
            --btn-hover-bg: #322822;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Tarjeta del widget */
        .widget-container {
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 28px 24px 20px 24px;
            max-width: 450px;
            width: 88%;
            text-align: center;
            box-shadow: 0px 2px 6px var(--shadow);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        /* Botón discreto para alternar tema (esquina superior derecha) */
        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            padding: 4px;
            line-height: 1;
        }

        .theme-toggle:hover {
            opacity: 1;
        }

        /* Texto de la frase */
        #texto-frase {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-main);
            line-height: 1.5;
            margin: 10px 0 12px 0;
            font-style: italic;
        }

        /* Autor de la frase */
        #autor-frase {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            margin: 0 0 18px 0;
        }

        /* Botón "Ver otra frase" */
        #btn-cambiar {
            background-color: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        #btn-cambiar:hover {
            background-color: var(--btn-hover-bg);
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- Botón para alternar tema manualmente -->
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
        
        <p id="texto-frase">"Cargando frase..."</p>
        <p id="autor-frase"></p>
        <button id="btn-cambiar" onclick="mostrarFraseAleatoria()">Ver otra frase</button>
    </div>

    <script>
        const bancoDeFrases = [
            { texto: "La felicidad de tu vida depende de la calidad de tus pensamientos.", autor: "Marco Aurelio" },
            { texto: "No es que tengamos poco tiempo, sino que perdemos mucho.", autor: "Séneca" },
            { texto: "El hombre que mueve montañas empieza cargando pequeñas piedras.", autor: "Confucio" },
            { texto: "Vence al enemigo que llevas dentro y los de fuera no te harán daño.", autor: "Proverbio Africano" },
            { texto: "La vida es muy simple, pero insistimos en hacerla complicada.", autor: "Confucio" },
            { texto: "Quien tiene un porqué para vivir puede soportar casi cualquier cómo.", autor: "Friedrich Nietzsche" },
            { texto: "Somos lo que hacemos repetidamente. La excelencia, entonces, no es un acto, sino un hábito.", autor: "Aristóteles" },
            { texto: "No busques que los eventos sucedan como tú deseas, sino desea que sucedan como suceden.", autor: "Epicteto" }
        ];

        function mostrarFraseDelDia() {
            const hoy = new Date();
            const numeroDia = hoy.getDate() + hoy.getMonth() + hoy.getFullYear();
            const indiceFrase = numeroDia % bancoDeFrases.length;
            const fraseSeleccionada = bancoDeFrases[indiceFrase];
            document.getElementById("texto-frase").innerText = `"${fraseSeleccionada.texto}"`;
            document.getElementById("autor-frase").innerText = fraseSeleccionada.autor;
        }

        function mostrarFraseAleatoria() {
            const indiceAleatorio = Math.floor(Math.random() * bancoDeFrases.length);
            const fraseSeleccionada = bancoDeFrases[indiceAleatorio];
            document.getElementById("texto-frase").innerText = `"${fraseSeleccionada.texto}"`;
            document.getElementById("autor-frase").innerText = fraseSeleccionada.autor;
        }

        function detectarPreferenciaTema() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                aplicarTema('dark');
            } else {
                aplicarTema('light');
            }
        }

        function aplicarTema(tema) {
            if (tema === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').innerText = '☀️';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('theme-btn').innerText = '🌙';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                aplicarTema('light');
            } else {
                aplicarTema('dark');
            }
        }

        detectarPreferenciaTema();
        mostrarFraseDelDia();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            aplicarTema(e.matches ? 'dark' : 'light');
        });
    </script>
</body>
</html>
